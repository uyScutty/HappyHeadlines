name: Happy Headlines CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: article-service
            dockerfile: ArticleService/Dockerfile
          - name: comment-service
            dockerfile: CommentService/Dockerfile
          - name: article-cache-worker
            dockerfile: ArticleCacheWorker/dockerfile
          - name: profanity-service
            dockerfile: ProfanityService/Dockerfile

    steps:
      - name: Download source code
        uses: actions/checkout@v6

      - name: Set lowercase image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service.name }}
        run: echo "name=ghcr.io/${OWNER,,}/${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:1.0.${{ github.run_number }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}